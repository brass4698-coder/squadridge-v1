version: 2
updates:
  # npm — frontend + dev dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      radix-ui:
        patterns:
          - '@radix-ui/*'
      semaphore:
        patterns:
          - '@semaphore-protocol/*'
      testing:
        patterns:
          - '@playwright/test'
          - '@testing-library/*'
          - '@vitest/*'
          - 'vitest'
          - 'jsdom'
      vite-ecosystem:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'esbuild'
          - 'rollup-plugin-visualizer'
      linting:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'lint-staged'
          - 'husky'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - '@types/react'
          - '@types/react-dom'
    ignore:
      # Semaphore major bumps require ZK circuit validation — update manually
      - dependency-name: '@semaphore-protocol/*'
        update-types:
          - version-update:semver-major

  # GitHub Actions — keep action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      actions-core:
        patterns:
          - 'actions/*'
      github-security:
        patterns:
          - 'github/codeql-action'
          - 'actions/dependency-review-action'
