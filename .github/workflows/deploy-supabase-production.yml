# Deploy Supabase migrations (and Edge Functions when secrets allow) to production.
# Required secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID
# Optional (full Edge deploy): ALLOWED_ORIGINS, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
# When optional secrets are missing, `db push` still runs; Edge secret sync + deploy are skipped.
# @see https://supabase.com/docs/guides/cli/cicd-workflows

name: Deploy Supabase to production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug_link:
        description: Run supabase link with --debug (verbose; use when link fails)
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ingest-message/index.ts imports ./edge.bundle.mjs (gitignored). Without this step
      # `supabase functions deploy ingest-message` ships a broken function and message
      # inserts fail in prod (migration 20260428194500 revokes direct client inserts).
      - name: Bundle ingest-message Edge function
        run: npm run bundle:ingest-message

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase CLI version
        run: supabase --version

      # GitHub omits unset secrets; empty vars cause "Cannot find project ref" from the CLI.
      - name: Verify required Supabase secrets
        run: |
          missing=0
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Repo → Settings → Secrets and variables → Actions."; missing=1; fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then echo "::error::SUPABASE_DB_PASSWORD is not set."; missing=1; fi
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then echo "::error::SUPABASE_PROJECT_ID is not set (project ref from the dashboard URL)."; missing=1; fi
          exit "$missing"

      - name: Check Edge deploy secrets (optional)
        id: edge_secrets
        run: |
          if [ -n "${ALLOWED_ORIGINS:-}" ] && [ -n "${UPSTASH_REDIS_REST_URL:-}" ] && [ -n "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Edge secrets incomplete (need all of ALLOWED_ORIGINS, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN). Migrations will still deploy; Edge secret sync and function deploy are skipped until you add them."
          fi

      # Classic PATs use sbp_*; experimental sbp_v0_* tokens are rejected by the CLI (see supabase/cli#1033).
      - name: Check access token format
        run: |
          case "${SUPABASE_ACCESS_TOKEN}" in
            sbp_v0_*)
              echo "::error::This token looks like an experimental Supabase PAT (sbp_v0_*). The CLI needs a classic token. In the dashboard, generate a token without the experimental / v0 option, or use 'Generate new token' as a classic PAT."
              exit 1
              ;;
            sbp_*)
              echo "Access token uses classic sbp_ prefix (OK for CLI)."
              ;;
            *)
              echo "::warning::Token does not start with sbp_. Ensure this is a Personal Access Token from https://supabase.com/dashboard/account/tokens — not the anon or service_role API key."
              ;;
          esac

      # CLI expects only the project ref (subdomain), e.g. `abcdefghijklmnopqr12`, not the full URL or a UUID.
      - name: Normalize project ref
        run: |
          set -euo pipefail
          raw="${SUPABASE_PROJECT_ID}"
          raw="${raw//$'\r'/}"
          raw="${raw//$'\n'/}"
          raw="$(echo "$raw" | xargs)"
          raw="$(echo "$raw" | tr '[:upper:]' '[:lower:]')"
          ref="$raw"
          if [[ "$raw" =~ ^https?://([a-z0-9]+)\.supabase\.co ]]; then
            ref="${BASH_REMATCH[1]}"
          elif [[ "$raw" =~ ^([a-z0-9]+)\.supabase\.co ]]; then
            ref="${BASH_REMATCH[1]}"
          fi
          if ! [[ "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID must be your 20-character project ref (subdomain only), e.g. from https://YOUR_REF.supabase.co — not the project UUID and not extra path segments."
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "Project ref normalized (${#ref} characters)."

      - name: Link Supabase project
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.debug_link }}" = "true" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes --debug
          else
            supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
          fi

      - name: Push database migrations
        run: supabase db push

      - name: Sync Edge Function secrets (CORS + rate limit)
        if: steps.edge_secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          supabase secrets set \
            ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
            UPSTASH_REDIS_REST_URL="$UPSTASH_REDIS_REST_URL" \
            UPSTASH_REDIS_REST_TOKEN="$UPSTASH_REDIS_REST_TOKEN"

      - name: Deploy Edge Functions
        if: steps.edge_secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if compgen -G "supabase/functions/*/index.ts" > /dev/null 2>&1; then
            echo "Deploying Edge Functions..."
            supabase functions deploy
          else
            echo "No Edge Functions found (expected supabase/functions/<name>/index.ts); skipping."
          fi
