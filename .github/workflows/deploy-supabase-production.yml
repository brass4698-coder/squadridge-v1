# Deploy Supabase migrations (and Edge Functions when present) to production.
# Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID
# @see https://supabase.com/docs/guides/cli/cicd-workflows

name: Deploy Supabase to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          if compgen -G "supabase/functions/*/index.ts" > /dev/null 2>&1; then
            echo "Deploying Edge Functions..."
            supabase functions deploy
          else
            echo "No Edge Functions found (expected supabase/functions/<name>/index.ts); skipping."
          fi
