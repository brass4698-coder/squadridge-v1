name: Deploy Staging

on:
  push:
    branches: [develop, staging]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    env:
      # Production build requires Sentry DSN (see src/lib/sentry.ts). Fallbacks keep fork CI green without secrets.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || 'https://examplePublicKey@o0.ingest.sentry.io/4500000000000000' }}
      # VITE_SENTRY_USER_HASH_SALT is required when VITE_SENTRY_DSN is set (src/lib/env.ts enforces this).
      # Use a stable placeholder so staging builds pass without the real secret configured.
      VITE_SENTRY_USER_HASH_SALT: ${{ secrets.VITE_SENTRY_USER_HASH_SALT || 'staging-ci-placeholder-salt-32chars!!' }}
      VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT || 'staging' }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder_for_ci_only' }}
      # vite.config.ts enforces VITE_ZK_STUB=false for production-mode builds.
      VITE_ZK_STUB: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check:prod-readiness

      # FIX: removed duplicate step-level env block. Job-level env already
      # supplies VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY with
      # fallbacks; redeclaring them at step level created a silent divergence
      # risk where future changes to job-level vars would not propagate here.
      - name: Test
        run: npm run test

      # FIX: changed `npm run build` → `npm run build:e2e` so Playwright runs
      # against the e2e artifact (mode=e2e, loads .env.e2e, Semaphore demo
      # decoys enabled). The previous production build caused ZK proof flows
      # that depend on demo decoys to fail or be silently skipped on staging CI.
      - run: npm run build:e2e

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test
        env:
          CI: true

      # Deploy steps require project-specific secrets (Supabase CLI, Netlify token, site id).
      # When enabling Supabase deploy for staging, use the same Edge secrets as production:
      # ALLOWED_ORIGINS, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN (per staging project / frontend URL).
      # - name: Deploy Supabase (staging)
      #   run: supabase link --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }} && supabase db push && supabase functions deploy
      #
      # - name: Deploy frontend (Netlify)
      #   run: npx netlify deploy --prod --dir=dist --site ${{ secrets.NETLIFY_SITE_ID }}
