# Build the static SPA for manual or host-specific deploy (Vercel/Netlify/Cloudflare attach artifacts or call this workflow).
# Database migrations stay in deploy-supabase-production.yml — run both for a full release.

name: Build frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # was '20' — all workflows now use Node 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # Vitest imports src/utils/supabase.ts at collection time and throws
          # without these vars — same pattern as ci.yml.
          VITE_SUPABASE_URL: https://xxxxxxxxxxxxxxxxxxxx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

      - name: Ensure no ZK hash stub for production bundle
        run: npm run check:no-zk-stub-prod

      - name: Ensure no bundled Semaphore demo decoys for production bundle
        run: npm run check:no-demo-decoys-prod

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://xxxxxxxxxxxxxxxxxxxx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          VITE_ZK_STUB: 'false'
          # Sentry (optional — empty values mean "no Sentry in this artifact").
          # When VITE_SENTRY_DSN is set, src/lib/env.ts requires VITE_SENTRY_USER_HASH_SALT
          # in production builds, so configure both secrets together or neither.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_USER_HASH_SALT: ${{ secrets.VITE_SENTRY_USER_HASH_SALT }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT || 'production' }}
          # NOTE: VITE_SEMAPHORE_DEMO_GROUP / VITE_ALLOW_DEMO_DECOYS_IN_PROD are intentionally
          # NOT set here. Bundled decoys collapse the anonymity set; production must source
          # decoys from an issuer-managed group at runtime (see
          # docs/technical/rfc-issuer-managed-anonymity-group.md).

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: squadridge-dist
          path: dist/
