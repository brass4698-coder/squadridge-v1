# Build the static SPA for manual or host-specific deploy (Vercel/Netlify/Cloudflare attach artifacts or call this workflow).
# Database migrations stay in deploy-supabase-production.yml — run both for a full release.

name: Build frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://xxxxxxxxxxxxxxxxxxxx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          VITE_ZK_STUB: 'false'

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: squadridge-dist
          path: dist/
