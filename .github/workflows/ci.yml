# Frontend: typecheck, tests, production build (catches VITE_ZK_STUB in production — see vite.config.ts), Playwright e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Banned public copy
        run: npm run check:banned-copy

      - name: Production readiness checks
        run: npm run check:prod-readiness

      - name: Ensure no ZK hash stub for release artifacts
        run: npm run check:no-zk-stub-prod

      - name: Ensure no bundled Semaphore demo decoys for release artifacts
        run: npm run check:no-demo-decoys-prod

      - name: Ensure no raw console.* in production-data paths
        run: npm run check:no-raw-console

      - name: Test
        run: npm test
        env:
          # Vitest/Vite must see Supabase URL when tests import `src/utils/supabase.ts` (.env.test also sets these locally).
          VITE_SUPABASE_URL: https://xxxxxxxxxxxxxxxxxxxx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

      - name: Production build
        run: npm run build
        env:
          # Minimal build-time vars so `tsc`/Vite can resolve imports; real secrets not required for CI compile.
          VITE_SUPABASE_URL: https://xxxxxxxxxxxxxxxxxxxx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          # Explicit: production must not ship ZK stub (vite.config.ts also enforces).
          VITE_ZK_STUB: 'false'
          # NOTE: VITE_SEMAPHORE_DEMO_GROUP is intentionally NOT set here. Bundled decoys would
          # collapse the prod anonymity set (see scripts/ensure-no-demo-decoys-prod.mjs and
          # vite.config.ts). The e2e job below uses `npm run build:e2e` (mode=e2e) where
          # bundled decoys are deliberate via .env.e2e.

  e2e:
    runs-on: ubuntu-latest
    env:
      # Playwright webServer runs `npm run build:e2e` (mode=e2e), which loads `.env.e2e`.
      # Bundled Semaphore demo decoys are deliberate for e2e since proofs run against the
      # CI Supabase placeholder; this mode never produces a release artifact.
      VITE_SUPABASE_URL: https://xxxxxxxxxxxxxxxxxxxx.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      VITE_ZK_STUB: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test
        env:
          CI: true

  # Supply-chain hygiene. Two distinct gates:
  #
  #  1. dependency-review-action (PR-only): hard-fails when a pull request
  #     introduces a NEW high or critical advisory. This protects forward
  #     progress without needing to first eliminate the existing transitive
  #     advisories tracked in docs/security/dependency-advisories.md.
  #
  #  2. npm audit (informational): emits a job summary of current production
  #     advisories on every push and PR so dispositions in
  #     docs/security/dependency-advisories.md can be kept in sync. This step
  #     deliberately does NOT fail the build today (continue-on-error: true)
  #     because the documented residual chain (@xenova/transformers,
  #     @semaphore-protocol/proof transitive) cannot be remediated without
  #     upstream movement; turning the gate on would block unrelated PRs.
  #     Re-evaluate and remove continue-on-error once those chains are clean.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production runtime, informational)
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## Production-runtime npm audit'
            echo
            echo 'See docs/security/dependency-advisories.md for the disposition of each currently-accepted advisory.'
            echo
            echo '```'
            npm audit --omit=dev --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high

  # Applies all migrations to a local Supabase stack so broken SQL is caught on every PR.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2

      - name: Start local stack and apply migrations
        run: |
          supabase start
          supabase db reset

      - name: Check database.types.ts vs codegen (local)
        run: npm run check:database-types

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Bundle ingest-message Edge function
        run: npm run bundle:ingest-message
