[[headers]]
  for = "/*"
  [headers.values]
    # script-src: removed 'unsafe-inline' and 'unsafe-eval'. 'wasm-unsafe-eval' is retained
    # for Semaphore (snarkjs) WASM. If a future library triggers inline-script CSP violations,
    # prefer hashed/nonced scripts over re-enabling 'unsafe-inline'; see docs/security/threat-model.md.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://*.supabase.co https://*.sentry.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.sentry.io; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
