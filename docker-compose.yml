# Optional local Redis — reserved for future rate limits or queue workers. The app’s matchmaking
# path uses PostgreSQL today; do not assume Redis is required to run the client or Supabase flows.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - mendguild-redis-data:/data

volumes:
  mendguild-redis-data:
